version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: datamgmt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampass123
      POSTGRES_DB: examdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examuser -d examdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
